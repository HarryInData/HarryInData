<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="320">
  <defs>
    <linearGradient id="card-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14141c"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="flame-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5500"/>
      <stop offset="100%" stop-color="#FF003F"/>
    </linearGradient>
    <linearGradient id="rank-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF003F"/>
      <stop offset="100%" stop-color="#990026"/>
    </linearGradient>
    <filter id="p5-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .bg { fill: #0D0D12; stroke: #FF003F; stroke-width: 2; rx: 14px; }
    .panel { fill: #16161F; stroke: #2D141C; stroke-width: 1.5; rx: 10px; }
    .title { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; font-size: 15px; font-weight: bold; }
    .accent { fill: #FF003F; font-weight: bold; }
    .lbl { fill: #9999AA; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; }
    .val { fill: #FFFFFF; font-family: 'Consolas', 'Courier New', monospace; font-size: 20px; font-weight: bold; }
    .val-accent { fill: #FF1A40; font-family: 'Consolas', monospace; font-size: 22px; font-weight: bold; }
    .rank-box { fill: url(#rank-grad); stroke: #FF003F; stroke-width: 2; rx: 10px; }
    .rank-letter { fill: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Impact', sans-serif; font-size: 38px; font-weight: bold; }
    .prog-bg { fill: #242430; rx: 4px; }
    .prog-bar { fill: #FF003F; rx: 4px; }
    @keyframes pulseFire {
      0%, 100% { transform: scale(1); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
    }
  </style>

  <!-- Base Card -->
  <rect width="900" height="320" class="bg"/>

  <!-- Top Title Bar -->
  <text x="25" y="32" class="title">🔥 <tspan class="accent">METAVERSE DEVELOPER METRICS</tspan> // OVERALL PERFORMANCE</text>
  <text x="875" y="32" fill="#777788" font-family="monospace" font-size="12px" text-anchor="end">LEVEL 99 • PHANTOM COGNITION</text>

  <!-- Left Column: Core Stats -->
  <rect x="25" y="55" width="415" height="240" class="panel"/>
  
  <!-- Rank Badge -->
  <rect x="45" y="75" width="80" height="80" class="rank-box" filter="url(#p5-glow)"/>
  <text x="85" y="122" class="rank-letter" text-anchor="middle">S+</text>
  <text x="85" y="145" fill="#FFAAAA" font-family="monospace" font-size="10px" font-weight="bold" text-anchor="middle">TOP 0.5%</text>

  <!-- Stats List -->
  <g transform="translate(145, 75)">
    <text x="0" y="20" class="lbl">Total Stars Earned:</text>
    <text x="270" y="20" class="val-accent" text-anchor="end">520 ⭐</text>
    
    <text x="0" y="55" class="lbl">Total Commits (2025-2026):</text>
    <text x="270" y="55" class="val" text-anchor="end">2,684 ⚡</text>

    <text x="0" y="90" class="lbl">Merged Pull Requests:</text>
    <text x="270" y="90" class="val" text-anchor="end">184 🚀</text>

    <text x="0" y="125" class="lbl">Public Repositories:</text>
    <text x="270" y="125" class="val" text-anchor="end">34 📦</text>

    <text x="0" y="160" class="lbl">Code Contributions:</text>
    <text x="270" y="160" class="val-accent" text-anchor="end">540K+ LOC</text>
  </g>

  <!-- Right Column: Streak & Languages -->
  <rect x="460" y="55" width="415" height="240" class="panel"/>

  <!-- Streak Section -->
  <g transform="translate(480, 75)">
    <text x="0" y="16" class="lbl">🔥 Current Streak</text>
    <text x="0" y="48" class="val-accent">68 Days</text>
    <text x="0" y="68" fill="#777788" font-family="monospace" font-size="11px">Aug 14, 2026 - Present</text>

    <text x="200" y="16" class="lbl">⚡ Longest Streak</text>
    <text x="200" y="48" class="val">142 Days</text>
    <text x="200" y="68" fill="#777788" font-family="monospace" font-size="11px">All-Time Peak Record</text>

    <!-- Separator -->
    <line x1="0" y1="88" x2="375" y2="88" stroke="#2D141C" stroke-width="1.5"/>

    <!-- Language Breakdown -->
    <text x="0" y="112" class="lbl">Top Languages &amp; Arsenal</text>

    <!-- Python -->
    <text x="0" y="135" fill="#EEEEF2" font-family="monospace" font-size="12px">Python (AI / ML / Data)</text>
    <text x="375" y="135" fill="#FF1A40" font-family="monospace" font-size="12px" text-anchor="end">48.5%</text>
    <rect x="0" y="142" width="375" height="6" class="prog-bg"/>
    <rect x="0" y="142" width="182" height="6" class="prog-bar"/>

    <!-- TypeScript / Next.js -->
    <text x="0" y="167" fill="#EEEEF2" font-family="monospace" font-size="12px">TypeScript &amp; Next.js</text>
    <text x="375" y="167" fill="#FF1A40" font-family="monospace" font-size="12px" text-anchor="end">28.0%</text>
    <rect x="0" y="174" width="375" height="6" class="prog-bg"/>
    <rect x="0" y="174" width="105" height="6" fill="#3178C6" rx="4px"/>

    <!-- C++ / PyTorch -->
    <text x="0" y="199" fill="#EEEEF2" font-family="monospace" font-size="12px">C++ &amp; CUDA / Systems</text>
    <text x="375" y="199" fill="#FF1A40" font-family="monospace" font-size="12px" text-anchor="end">14.5%</text>
    <rect x="0" y="206" width="375" height="6" class="prog-bg"/>
    <rect x="0" y="206" width="54" height="6" fill="#F34B7D" rx="4px"/>
  </g>
</svg>
